name: Update MDBList catalogues

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: write

jobs:
  update-lists:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build MDBList catalogues
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: python scripts/update_mdblists.py

      - name: Commit updated catalogues
        run: |
          if git diff --quiet; then
            echo "No catalogue changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/movie catalog/series
          git commit -m "Update Strand catalogues from MDBList"
          git push
