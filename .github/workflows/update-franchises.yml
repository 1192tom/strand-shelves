name: Update franchise catalogues

on:
  workflow_dispatch:
  schedule:
    - cron: "35 5 * * 3"

permissions:
  contents: write

jobs:
  update-franchises:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build franchise catalogues
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_franchise_catalogs.py

      - name: Commit updated catalogues
        run: |
          if git diff --quiet; then
            echo "No catalogue changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/movie
          git commit -m "Update Strand franchise catalogues"
          git push
